name: Compila installer Windows

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24.18.0
  RUST_VERSION: 1.98.0
  CARGO_TARGET_DIR: ${{ github.workspace }}\src-tauri\target-ci

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Rust MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install "${env:RUST_VERSION}-x86_64-pc-windows-msvc" --profile minimal --no-self-update
          rustup default "${env:RUST_VERSION}-x86_64-pc-windows-msvc"

      - name: Cache runtime Pi verificato
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: vendor/pi-runtime
          key: pi-runtime-${{ runner.os }}-${{ hashFiles('scripts/vendor-pi-runtime.mjs', 'scripts/patches/**', 'package-lock.json') }}

      - name: Dipendenze e runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          npm run vendor:pi
          npm run vendor:pi:check
          npm run release:check

      - name: Verifica completa
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run check
          npm test
          npm run test:smoke
          cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Compila EXE e MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run build:desktop:offline

      - name: Hash SHA-256
        shell: pwsh
        run: |
          $bundle = Join-Path $env:CARGO_TARGET_DIR 'release\bundle'
          $file = Join-Path $bundle 'SHA256SUMS.txt'
          Get-ChildItem $bundle -Recurse -File -Include *.exe,*.msi |
            Sort-Object FullName |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name } |
            Set-Content -LiteralPath $file -Encoding utf8

      - name: Pubblica artefatti della build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: interfaccia-pi-windows-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target-ci/release/bundle/nsis/*
            src-tauri/target-ci/release/bundle/msi/*
            src-tauri/target-ci/release/bundle/SHA256SUMS.txt
