name: Candidato production con updater Windows

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24.18.0
  RUST_VERSION: 1.98.0
  CARGO_TARGET_DIR: ${{ github.workspace }}\src-tauri\target-production-ci

jobs:
  candidato-production:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # La chiave privata e la password restano GitHub Actions secrets. La
      # pubblica puo essere letta, ma viene conservata come secret per
      # mantenere intatte le due righe Minisign nell'iniezione dell'ambiente.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      PI_GUI_UPDATER_PUBLIC_KEY: ${{ secrets.PI_GUI_UPDATER_PUBLIC_KEY }}
      PI_GUI_UPDATER_ENDPOINTS_JSON: ${{ vars.PI_GUI_UPDATER_ENDPOINTS_JSON }}
      SISTEMA_GUIDATO_BUNDLE_TOKEN: ${{ secrets.SISTEMA_GUIDATO_BUNDLE_TOKEN }}
      SISTEMA_GUIDATO_BUNDLE_REPOSITORY: ${{ vars.SISTEMA_GUIDATO_BUNDLE_REPOSITORY }}
      SISTEMA_GUIDATO_BUNDLE_TAG: ${{ vars.SISTEMA_GUIDATO_BUNDLE_TAG }}
      SISTEMA_GUIDATO_BUNDLE_ASSET: ${{ vars.SISTEMA_GUIDATO_BUNDLE_ASSET }}
      SISTEMA_GUIDATO_BUNDLE_SHA256: ${{ vars.SISTEMA_GUIDATO_BUNDLE_SHA256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Rust MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install "${env:RUST_VERSION}-x86_64-pc-windows-msvc" --profile minimal --no-self-update
          rustup default "${env:RUST_VERSION}-x86_64-pc-windows-msvc"

      - name: Cache runtime Pi verificato
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: vendor/pi-runtime
          key: pi-runtime-${{ runner.os }}-${{ hashFiles('scripts/vendor-pi-runtime.mjs', 'scripts/patches/**', 'package-lock.json') }}

      - name: Dipendenze e runtime Pi
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          npm run vendor:pi
          npm run vendor:pi:check

      - name: Acquisisce Sistema Guidato verificato
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pwsh -NoProfile -File scripts/prepare-sistema-guidato.ps1
          npm run vendor:sistema:check
          npm run release:check

      - name: Genera configurazione production o fallisce chiusa
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run updater:production:prepare

      - name: Verifica completa
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run check
          npm test
          npm run test:smoke
          cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Compila candidato e firme updater
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run build:desktop:production

      - name: Verifica presenza firme updater
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:CARGO_TARGET_DIR 'release\bundle'
          $installer = @(Get-ChildItem $bundle -Recurse -File -Include *.exe,*.msi)
          $firme = @(Get-ChildItem $bundle -Recurse -File -Filter *.sig)
          if ($installer.Count -lt 1) { throw 'Nessun installer Windows prodotto' }
          if ($firme.Count -lt 1) { throw 'createUpdaterArtifacts non ha prodotto firme .sig' }

      - name: Hash SHA-256
        shell: pwsh
        run: |
          $bundle = Join-Path $env:CARGO_TARGET_DIR 'release\bundle'
          $file = Join-Path $bundle 'SHA256SUMS.txt'
          Get-ChildItem $bundle -Recurse -File -Include *.exe,*.msi,*.sig |
            Sort-Object FullName |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name } |
            Set-Content -LiteralPath $file -Encoding utf8

      - name: Pubblica solo gli artefatti del candidato
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: interfaccia-pi-production-candidate-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target-production-ci/release/bundle/nsis/*
            src-tauri/target-production-ci/release/bundle/msi/*
            src-tauri/target-production-ci/release/bundle/**/*.sig
            src-tauri/target-production-ci/release/bundle/SHA256SUMS.txt

      # Nessuna release e nessun latest.json vengono pubblicati da questo job.
      # G11 resta aperto finche il candidato non supera il drill reale N-1,
      # recovery e rollback documentato su una macchina Windows pulita.
