name: Verifica Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verifica-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.18.0
  RUST_VERSION: 1.98.0

jobs:
  verifica:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Rust MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install "${env:RUST_VERSION}-x86_64-pc-windows-msvc" --profile minimal --no-self-update
          rustup default "${env:RUST_VERSION}-x86_64-pc-windows-msvc"
          rustc --version
          cargo --version

      - name: Cache runtime Pi verificato
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: vendor/pi-runtime
          key: pi-runtime-${{ runner.os }}-${{ hashFiles('scripts/vendor-pi-runtime.mjs', 'scripts/patches/**', 'package-lock.json') }}

      - name: Dipendenze JavaScript
        run: npm ci

      - name: Prepara runtime Pi
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run vendor:pi
          npm run vendor:pi:check

      - name: Coerenza versione release
        run: npm run release:check

      - name: Controlli sintattici
        run: npm run check

      - name: Test JavaScript e bridge
        # I test avviano processi e timer Windows reali. Sul runner ospitato il
        # parallelismo fra file puo affamare PowerShell o la coda eventi e
        # produrre timeout infrastrutturali. Manteniamo l'intera suite, ma con
        # un file alla volta per una verifica riproducibile.
        run: node --test --test-concurrency=1 tests/*.test.mjs app/tests/*.test.mjs

      - name: Smoke test sul runtime incluso
        run: npm run test:smoke

      - name: Test launcher Tauri
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
