[package]
name = "interfaccia-pi"
version = "2.6.1"
description = "Interfaccia grafica per l'agente pi"
authors = ["Antonio Amodeo"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "interfaccia_pi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
